# Lake County, IL — every municipality plus the county itself.
#
# Fields
#   slug       short id used in file paths and the database
#   name       display name
#   kind       village | city | county
#   url        homepage (the collector discovers agenda pages from here)
#   verified   true = URL confirmed during research; false = best guess, check the discovery report
#   platform   optional hint: civicplus | granicus | civicclerk | legistar | generic
#              leave blank and `python -m civic discover` fingerprints the site
#   seeds      optional extra start pages (agenda/minutes pages) for the crawler
#   legistar   Legistar client name, if the body publishes through Legistar
#   civicclerk CivicClerk tenant name (from <tenant>.portal.civicclerk.com)
#   note       anything a human should know
#
# Partial towns (most of the town sits in another county) are included but marked.

towns:
  - {slug: lake-county, name: Lake County, kind: county, url: https://www.lakecountyil.gov, verified: true, platform: civicplus, legistar: lakecounty,
     seeds: [https://lakecounty.legistar.com/Calendar.aspx],
     note: "County Board, PBZ&E Committee, Zoning Board of Appeals. Legistar client 'lakecounty' is correct, but its events API returns 500 (Nov 2026); the Calendar.aspx seed picks up agenda PDFs instead."}

